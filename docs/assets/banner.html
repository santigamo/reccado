<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Source of docs/assets/banner.jpg. Re-render with the recipe in docs/BRAND.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1440px; height: 617px; }
  .banner {
    position: relative; width: 1440px; height: 617px; overflow: hidden;
    background:
      radial-gradient(760px 560px at 74% 46%, rgba(243,128,32,0.34), rgba(243,128,32,0.10) 42%, rgba(12,10,9,0) 68%),
      radial-gradient(900px 700px at 104% 118%, rgba(226,64,15,0.26), rgba(12,10,9,0) 62%),
      radial-gradient(700px 500px at -6% -10%, rgba(27,42,65,0.55), rgba(12,10,9,0) 70%),
      #0C0A09;
    font-family: 'Poppins', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
  }
  .brand { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 30px; }
  .mark { width: 92px; height: 92px; filter: drop-shadow(0 18px 40px rgba(243,128,32,0.45)); }
  .word { font-weight: 500; font-size: 92px; line-height: 1; letter-spacing: 0.07em; color: #fff; text-shadow: 0 2px 44px rgba(243,128,32,0.28); }
  .rule { height: 4px; width: 112px; border-radius: 4px; background: linear-gradient(90deg, #FBAD41, #F38020 55%, #E2400F); box-shadow: 0 0 26px rgba(243,128,32,0.6); }
  .window {
    position: absolute; left: 690px; top: 86px; width: 1040px; height: 650px;
    border-radius: 18px; overflow: hidden; background: #fff;
    border: 1px solid rgba(255,255,255,0.55);
    box-shadow: 0 50px 120px rgba(0,0,0,0.6), 0 0 0 10px rgba(255,255,255,0.06), 0 30px 90px rgba(243,128,32,0.28);
    transform: perspective(2200px) rotateY(-9deg) rotateX(3deg) rotateZ(0.6deg);
    transform-origin: left center;
  }
  .window img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="banner">
    <div class="window"><img src="screenshot-inbox.jpg" alt=""></div>
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bm" x1="4" y1="11" x2="25" y2="28" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FBAD41"/><stop offset="0.55" stop-color="#F38020"/><stop offset="1" stop-color="#E2400F"/></linearGradient></defs><rect x="8.5" y="4.5" width="20" height="14.5" rx="3.2" fill="#FBAD41" opacity="0.5"/><rect x="3.5" y="11" width="22" height="16.5" rx="3.6" fill="url(#bm)"/><path d="M6.2 14.4l8.3 6.1 8.3-6.1" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="word">RECCADO</div>
      <div class="rule"></div>
    </div>
  </div>
</body>
</html>
